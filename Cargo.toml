[package]
name = "bulletty"
version = "0.3.0"
description = "a pretty TUI feed reader (RSS+ATOM) that stores articles locally as Markdown files"
authors = [ "Bruno Croci <bruno@croci.me>" ]
license = "MIT"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/crocidb/bulletty"
readme = "README.md"
homepage = "https://github.com/crocidb/bulletty"
documentation = "https://docs.rs/bulletty"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
color-eyre = "0.6.5"
etcetera = "0.11.0"
toml = "1.1.2"
serde = { version = "1.0.228", features = [ "derive" ] }
reqwest = { version = "0.13.3", features = [ "blocking", "gzip" ] }
tokio = { version = "1", features = [ "rt", "time" ] }
clap = { version = "4.5.60", features = [ "derive" ] }
roxmltree = "0.21.1"
openssl = { version = "0.10", features = [ "vendored" ] }
slug = "0.1"
html2md-bulletty = { version = "0.2.16" }
regex = "1.12.3"
chrono = { version = "0.4", features = [ "serde" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
tracing-appender = "0.2"
tracing-error = "0.2"
unicode-width = "0.2.2"
open = "5.3.3"
fuzzt = { version = "0.3.1", default-features = false, features = ["levenshtein"] }
ansi-to-tui = { version = "8.0.1" }
document-features = { version = "0.2.12" }
itertools = "0.15.0"
pretty_assertions = "1.4.1"
pulldown-cmark = "0.13.3"
rstest = "0.26.1"
syntect = { version = "5.3.0" }
url = "2.5.8"
html-escape = "0.2.13"
astral-tl = "0.7.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
indoc = "2.0.7"
tracing-subscriber = "0.3.23"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
